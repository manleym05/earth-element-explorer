<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Offline: Earth Element Explorer</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #14222e; color: #e6ecef;
           font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; padding: 16px; box-sizing: border-box; }
    img { width: 96px; height: 96px; border-radius: 20px; } h1 { font-size: 22px; margin: 16px 0 6px; } p { color: #9fb0ba; margin: 0 0 18px; }
    button { font: inherit; color: #14222e; background: #e3b63c; border: 0; border-radius: 8px; padding: 8px 18px; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <img src="icons/icon-192.png" alt="">
    <h1>You're offline</h1>
    <p>Earth Element Explorer needs an internet connection to load the globe and its data.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
